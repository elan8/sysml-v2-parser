# CI for sysml-v2-parser: build, test, and SysML v2 validation suite
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch SysML v2 Release (pinned)
        run: bash ./scripts/fetch-sysml-v2-release.sh

      - name: cargo test
        run: cargo test
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
          CI: true

  validation:
    name: SysML v2 validation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch SysML v2 Release (pinned)
        run: bash ./scripts/fetch-sysml-v2-release.sh

      - name: cargo test (full validation suite)
        run: cargo test -- --include-ignored
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
          CI: true

      - name: Conformance scorecard (L1 + L2)
        run: cargo test --test conformance_scorecard -- --nocapture
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
          CONFORMANCE_SCORECARD_DIR: ${{ github.workspace }}/conformance-out
          CONFORMANCE_SCORECARD_L2: "1"
          CI: true

      - name: Upload conformance scorecard
        uses: actions/upload-artifact@v4
        with:
          name: conformance-scorecard
          path: |
            conformance-out/conformance-scorecard.json
            conformance-out/conformance-scorecard.md
