# CI for sysml-v2-parser: build, test, and SysML v2 validation suite
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch SysML v2 Release (pinned)
        run: bash ./scripts/fetch-sysml-v2-release.sh

      - name: Semantic parser snapshot drift
        run: |
          cargo run --bin snapshot_tool -- update
          git diff --exit-code -- tests/snapshots/qualified_references

      - name: cargo test
        run: cargo test
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
          CI: true

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with `rust-version` in Cargo.toml. cc's ar_archive_writer dependency
      # (pulled in transitively via the stacker/psm build chain) currently requires 1.88;
      # bumping this floor is a deliberate choice made when stacker/psm/cc were last updated
      # rather than pinning those crates to old versions indefinitely.
      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build (lib + all targets)
        run: cargo build --all-targets --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # RUSTSEC-2026-0190 (anyhow, via proptest's wasm-target machinery) and RUSTSEC-2026-0097
      # (rand 0.9.2, via proptest) are "unsound" advisories with no fixed version published yet,
      # both reachable only through the proptest dev-dependency (never in the published library's
      # own dependency tree). Re-run `cargo audit` without --ignore periodically to check whether
      # either has a fix available yet, and drop it from this list once it does.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0190 --ignore RUSTSEC-2026-0097

  validation:
    name: SysML v2 validation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Fetch SysML v2 Release (pinned)
        run: bash ./scripts/fetch-sysml-v2-release.sh

      - name: cargo test (full validation suite)
        run: cargo test -- --include-ignored
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
          CI: true

      - name: Conformance scorecard (L1 + L2)
        run: cargo test --test conformance_scorecard -- --nocapture
        env:
          SYSML_V2_RELEASE_DIR: ${{ github.workspace }}/sysml-v2-release
          CONFORMANCE_SCORECARD_DIR: ${{ github.workspace }}/conformance-out
          CONFORMANCE_SCORECARD_L2: "1"
          CI: true

      - name: Upload conformance scorecard
        uses: actions/upload-artifact@v4
        with:
          name: conformance-scorecard
          path: |
            conformance-out/conformance-scorecard.json
            conformance-out/conformance-scorecard.md
