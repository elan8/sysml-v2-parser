[package]
name = "sysml-v2-parser"
version = "0.51.9"
edition = "2021"
rust-version = "1.88"
description = "SysML v2 textual notation parser for Rust"
license = "MIT"
repository = "https://github.com/elan8/sysml-v2-parser"
readme = "README.md"
keywords = ["sysml", "parser", "modeling", "kerml"]
categories = ["parser-implementations"]
exclude = ["sysml-v2-release/*", "target/*", "test-logs/*"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
log = "0.4"
nom = "8"
nom_locate = "5"
serde = { version = "1", features = ["derive"], optional = true }
stacker = "0.1.24"

[dev-dependencies]
criterion = "0.5"
env_logger = "0.11"
log = "0.4"
proptest = "1"

[[bench]]
name = "parser_bench"
harness = false
