[package]
name = "sysml-v2-parser"
version = "0.54.0"
edition = "2021"
rust-version = "1.88"
description = "SysML v2 textual notation parser for Rust"
license = "MIT"
repository = "https://github.com/elan8/sysml-v2-parser"
readme = "README.md"
keywords = ["sysml", "parser", "modeling", "kerml"]
categories = ["parser-implementations"]
exclude = ["sysml-v2-release/*", "target/*", "test-logs/*"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
log = "0.4"
memchr = "2"
nom = "8"
nom_locate = "5"
serde = { version = "1", features = ["derive"], optional = true }
stacker = "0.1.24"

[dev-dependencies]
criterion = "0.5"
env_logger = "0.11"
log = "0.4"
proptest = "1"
serde_json = "1"

[[bin]]
name = "snapshot_tool"
path = "tools/snapshot_tool/main.rs"

[[bin]]
name = "parser_profile"
path = "tools/parser_profile.rs"

[[bench]]
name = "parser_bench"
harness = false

[profile.release]
debug = 1
# The parser is one deep tree of small generic nom closures; whole-program optimization is worth
# ~19% on the snapshot corpus (`parser_profile`, `parser_bench`). Downstream crates set their own
# profile, so this only affects binaries and benches built from this repository.
lto = "fat"
codegen-units = 1

[profile.bench]
debug = 1
